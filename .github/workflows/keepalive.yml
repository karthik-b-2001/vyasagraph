# Neo4j AuraDB Free pauses after 3 days without activity. This runs one
# graph query through the API every day, which keeps it running.
# Set the repository variable API_URL (Settings → Secrets and variables →
# Actions → Variables) to the Cloud Run URL, e.g. https://vyasagraph-api-xxxx.run.app
name: Keep Aura awake

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Query the graph through the API
        run: curl -fsS --max-time 120 "${{ vars.API_URL }}/api/graph/stats" > /dev/null
